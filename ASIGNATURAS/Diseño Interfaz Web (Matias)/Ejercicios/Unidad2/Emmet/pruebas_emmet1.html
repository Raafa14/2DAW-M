        <!--
         3.- Lista no ordenada de 10 elementos (clases elemlist1 a elemlist10)
         Uso del operador $ 
         Comando utilizado: ul>li.elemlist$*10
        -->

    <ul>
        <li class="elemlist1"></li>
        <li class="elemlist2"></li>

        <!--
         4.- Enlace a Google con texto "Pinche aquí" y div hermano con dos h1 (.titulares1 y .titulares2)
         Uso del operador de nivel superior ^ o agrupación ()
         Comando utilizado: a[href="www.google.com"]{Pinche aquí}+div>h1.titulares1+h1.titulares2
        -->

    <a href="https://www.google.com">Pinche aquí</a>
    <div>
        <h1 class="titulares1"></h1>
        <h1 class="titulares2"></h1>
    </div>


        <!--
         5.-  Formulario POST (action="procesar.php") con 3 campos de texto, submit y reset,
         cada uno con su label vinculado mediante 'for' e 'id'.
         Uso de agrupación () y multiplicador de iteración $*3 (BUSCADO EN GEMINIS)
         Comando utilizado: form[method="post" action="procesar.php"]>(div*3>(label[for="campo$"]{Campo $}+input[type="text" id="campo$" name="campo$"]))+(div>(label[for="enviar"]{Enviar}+input:text[type="reset" id="enviar"]))+div>(label[for="resetear"]{Restablecer}+input:text[type="reset" id="resetear"])
        -->

    <form method="post" action="procesar.php">
        <div>
            <label for="campo1">Campo 1</label>
            <input type="text" id="campo1" name="campo1">
        </div>
        <div>
            <label for="campo2">Campo 2</label>
            <input type="text" id="campo2" name="campo2">
        </div>
        <div>
            <label for="campo3">Campo 3</label>
            <input type="text" id="campo3" name="campo3">
        </div>
        <div>
            <label for="enviar">Enviar</label>
            <input type="submit" id="enviar">
        </div>
        <div>
            <label for="resetear">Restablecer</label>
            <input type="reset" id="resetear">
        </div>
    </form>
